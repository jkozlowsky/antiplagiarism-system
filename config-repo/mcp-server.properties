server.port=8083
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/

spring.ai.mcp.server.name=ssbd-report-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Serwer MCP do przegladania i podsumowywania raportow antyplagiatowych (JPlag) w systemie SSBD.

groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b
groq.max-tokens=1024
groq.timeout.connect-ms=5000
groq.timeout.read-ms=60000

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000
spring.cloud.openfeign.client.config.api.read-timeout=10000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
