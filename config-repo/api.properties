server.port=8081
server.servlet.context-path=/api

eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/

# BAZY DANYCH (has?a czytane z Vaulta - brak domy?lnych warto?ci jawnych)
spring.datasource.mok.url=jdbc:postgresql://${DB_HOST:pgpool}:${DB_PORT:5432}/${DB_NAME:ssbd01_db}
spring.datasource.mok.username=${MOK_USER:ssbd01mok}
spring.datasource.mok.password=${mok_password}
spring.datasource.mok.name=mokDS

spring.datasource.mpp.url=jdbc:postgresql://${DB_HOST:pgpool}:${DB_PORT:5432}/${DB_NAME:ssbd01_db}
spring.datasource.mpp.username=${MPP_USER:ssbd01mpp}
spring.datasource.mpp.password=${mpp_password}
spring.datasource.mpp.name=mppDS

spring.datasource.admin.url=jdbc:postgresql://${DB_HOST:pgpool}:${DB_PORT:5432}/${DB_NAME:ssbd01_db}
spring.datasource.admin.username=${ADMIN_USER:ssbd01admin}
spring.datasource.admin.password=${pg_password}
spring.datasource.admin.name=adminDS

# JWT
security.jwt.expTime=1800
security.jwt.refreshExpTime=86400
# Zmienna security.jwt.secret wstrzyknie si? automatycznie z Vaulta (klucz: security.jwt.secret)

# LOGI
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/app/logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.txt
server.tomcat.accesslog.pattern=%{X-Forwarded-For}i %t "%r" %s %b
server.tomcat.accesslog.rotate=true

# RETRY & SCHEDULER
app.retry.maxattempts=3
app.retry.backoff=1000
app.scheduler.check.interval.ms=60000

# FEIGN: klient mcp-server (podsumowania AI) - dluzszy read-timeout, bo model Groq liczy do ~60s
spring.cloud.openfeign.client.config.mcp-server.connect-timeout=5000
spring.cloud.openfeign.client.config.mcp-server.read-timeout=90000

# APP CONFIG
#app.frontend.url=${APP_FRONTEND_URL:https://localhost}
app.hash.secret=${VERSION_HASH_SECRET:a}
app.account.unverified.expiration.hours=24
app.account.inactive.expiration.days=30
app.account.inactive.expiresat.days=7

# JPA / HIBERNATE
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false

# I18N
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ZEWN?TRZNE API
google.client.id=${GOOGLE_CLIENT_ID:233880181990-t0l5j9tq8et8pbpb9n854vtstcuap5t0.apps.googleusercontent.com}
#gitea.url=${GITEA_URL:http://gitea:3000}
# Zmienna gitea.token wstrzyknie si? automatycznie z Vaulta

# INNE
spring.flyway.out-of-order=true