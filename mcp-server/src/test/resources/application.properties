# Konfiguracja testowa – przesłania main/application.properties (brak importu z config-servera).
spring.application.name=mcp-server-test
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.main.banner-mode=off

spring.ai.mcp.server.name=ssbd-report-mcp-test
spring.ai.mcp.server.version=test
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# groq.api.url nadpisywany w teście integracyjnym (@DynamicPropertySource)
groq.api.url=http://localhost:1/unused
groq.model=test-model
groq.max-tokens=256
groq.timeout.connect-ms=2000
groq.timeout.read-ms=5000
