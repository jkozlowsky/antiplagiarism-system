# --- EMAIL MESSAGES (EmailService) ---
# Activation
email.activation.subject=Account Activation
email.activation.content=Click the link below to activate your account:\n\n <a href="{0}/activate?token={1}">Confirm and activate account</a>
email.activation.reminder.subject=Activation Reminder
email.activation.reminder.content=12 hours have passed. Please activate your account:\n\n <a href="{0}/activate?token={1}">Confirm and activate account</a>
email.account.deleted.subject=Account Deleted
email.account.deleted.content=Your account has been deleted due to a lack of activation within 24 hours.

# Account Status
email.account.blocked.subject=Notification - Your account has been blocked
email.account.blocked.content=Hello {0},\n\nYour account has been blocked. For more information, please contact the administrator.
email.account.unblocked.subject=Notification - Your account has been unblocked
email.account.unblocked.content=Hello {0},\n\nYour account has been unblocked. You can now log in to your account.
email.autoblock.subject=Notification - Your account has been automatically blocked
email.autoblock.content=Hello {0},\n\nYour account has been automatically blocked for 24 hours due to 3 consecutive failed login attempts.

# Email/Password Changes
email.email.changed.subject=Your email address has been changed by the administrator
email.email.changed.content=Hello,\n\nWe are writing to inform you that the administrator has updated your email address.\nIf you did not request this change, please contact the administrator immediately.\n\nBest regards,
email.email.change.request.subject=Notification - You requested an email change
email.email.change.request.content=Hello {0},\n\nYou have requested an email address change.\nClick the link below to confirm the change:\n\n<a href="{1}">Confirm new email address</a>\n\n
email.password.reset.subject=Password Reset
email.password.reset.content=Click the link below to reset your password:\n\n <a href="{0}">Reset password</a>

# Access Levels & Roles
email.accesslevel.revoked.subject=Notification - Access Level Revoked
email.accesslevel.revoked.content=Hello {0},\n\nWe are writing to inform you that your access level has been revoked: {1}.
email.accesslevel.granted.subject=Notification - Access Level Granted
email.accesslevel.granted.content=Hello {0},\n\nWe are writing to inform you that you have been granted a new access level: {1}.
email.admin.login.subject=Notification - New Administrator login detected
email.admin.login.content=Hello {0},\n\nA new session on your account with Administrator privileges has been detected.\nIP Address: {1}

email.2fa.subject=Code - Two-Factor Authentication (2FA)
email.2fa.content=Your 2FA verification code is: \n<b>{0}</b>\nThe code will expire in 5 minutes.

# Unblock due to inactivity
email.account.inactive.unblock.subject=Account blocked due to inactivity
email.account.inactive.unblock.content=Hello {0},\n\nYour account has been blocked due to inactivity (over 30 days). Click the link below to unblock it:\n\n<a href="{1}">Unblock your account</a>

email.only.auth.subject=Code - Email Authentication
email.only.auth.content=Your verification code is: \n<b>{0}</b>\nThe code will expire in 5 minutes.

email.email.revert.subject=Revert email address change
email.email.revert.content=Hello {0},\n\nYour email address has been changed to {1}. If this wasn't you, click below:\n\n<a href="{2}">Revert email change</a>

error.email.microservice.failure=An error occurred while communicating with the mail server. Please try again later.