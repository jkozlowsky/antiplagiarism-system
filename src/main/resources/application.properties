server.port=8081
server.servlet.context-path=/api
spring.application.name=ssbd01-api

spring.config.import=optional:configtree:/run/secrets/

#spring.sql.init.mode=always

spring.datasource.mok.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ssbd01_db}
spring.datasource.mok.username=${MOK_USER:ssbd01mok}
spring.datasource.mok.password=${mok_password:MokPass123!}
spring.datasource.mok.name=mokDS
#spring.datasource.mok.driver-class-name=org.postgresql.Driver

spring.datasource.mpp.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ssbd01_db}
spring.datasource.mpp.username=${MPP_USER:ssbd01mpp}
spring.datasource.mpp.password=${mpp_password:MppPass123!}
spring.datasource.mpp.name=mppDS
#spring.datasource.mpp.driver-class-name=org.postgresql.Driver

spring.datasource.admin.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ssbd01_db}
spring.datasource.admin.username=${ADMIN_USER:ssbd01admin}
spring.datasource.admin.password=${pg_password:AdminPass123!}
spring.datasource.admin.name=adminDS

#spring.datasource.admin.driver-class-name=org.postgresql.Driver

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

#spring.jpa.hibernate.ddl-auto=create
security.jwt.secret=${JWT_SECRET}
security.jwt.expTime=1800
security.jwt.refreshExpTime=86400

#logi
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/app/logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.txt
server.tomcat.accesslog.pattern=%h %t "%r" %s %b
server.tomcat.accesslog.rotate=true

#do uzupe?nienia, secrety b?d? szyfrowane
oauth.url=
oauth.username=
oauth.password=
oauth.client-id=
oauth.client-secret=

#mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${mail_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
