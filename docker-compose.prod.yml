services:
  proxy:
    image: nginx:1.29.6
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - proxy-frontend
      - proxy-backend
    depends_on:
      - frontend
      - backend

  frontend:
    image: registry.gitlab.com/iitpl/ssbd/2026/01/web:latest
    networks:
      - proxy-frontend
    restart: unless-stopped

  backend:
    image: registry.gitlab.com/iitpl/ssbd/2026/01/api:latest
    environment:
      - TZ=Europe/Warsaw
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${PG_DATABASE}
      - ADMIN_USER=${PG_USERNAME}
      - MOK_USER=${MOK_USER}
      - MPP_USER=${MPP_USER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
    secrets:
      - pg_password
      - mok_password
      - mpp_password
      - mail_password
    volumes:
      - ../logs:/app/logs
    networks:
      - proxy-backend
      - backend-db
    depends_on:
      - db

  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      MOK_USER: ${MOK_USER}
      MPP_USER: ${MPP_USER}
    secrets:
      - pg_password
      - mok_password
      - mpp_password
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - db_data:/var/lib/postgresql
    networks:
      - backend-db

networks:
  proxy-frontend:
    driver: bridge
  proxy-backend:
    driver: bridge
  backend-db:
    driver: bridge

volumes:
  db_data:

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
  mok_password:
    file: ./secrets/mok_password.txt
  mpp_password:
    file: ./secrets/mpp_password.txt
  mail_password:
    file: ./secrets/mail_password.txt