# --- EMAIL MESSAGES (EmailService) ---
# Activation
email.activation.subject=Account Activation
email.activation.content=Click the link to activate your account: {0}/activate?token={1}
email.activation.reminder.subject=Activation Reminder
email.activation.reminder.content=12 hours have passed. Please activate your account: {0}/activate?token={1}
email.account.deleted.subject=Account Deleted
email.account.deleted.content=Your account has been deleted due to lack of activation within 24 hours.

# Account Status
email.account.blocked.subject=Notification - Your account has been blocked
email.account.blocked.content=Hello {0},\n\nYour account has been blocked. For more information, please contact the administrator.
email.account.unblocked.subject=Notification - Your account has been unblocked
email.account.unblocked.content=Hello {0},\n\nYour account has been unblocked. You can now log into your account again.
email.autoblock.subject=Notification - Your account has been automatically blocked
email.autoblock.content=Hello {0},\n\nYour account has been automatically blocked for 24 hours due to 3 consecutive failed login attempts.

# Email/Password Changes
email.email.changed.subject=Your email address has been changed by administrator
email.email.changed.content=Hello,\n\nWe are writing to inform you that an administrator has updated your email address.\nIf you did not request this change, please contact the administrator immediately.\n\nBest regards,
email.email.change.request.subject=Notification - You have requested an email change
email.email.change.request.content=Hello {0},\n\nYou have requested an email change.\nPlease click the link below to confirm the change:\n{1}\n\n
email.password.reset.subject=Password Reset
email.password.reset.content=Click to reset your password: {0}

# Access Levels & Roles
email.accesslevel.revoked.subject=Notification - Access Level Revoked
email.accesslevel.revoked.content=Hello {0},\n\nWe are writing to inform you that your access level has been revoked: {1}.
email.accesslevel.granted.subject=Notification - Access Level Granted
email.accesslevel.granted.content=Hello {0},\n\nWe are writing to inform you that you have received a new access level: {1}.
email.admin.login.subject=Notification - New administrator login detected
email.admin.login.content=Hello {0},\n\nA new session has been detected on your account with Administrator privileges.\nIP Address: {1}

email.2fa.subject=Code - Two Factor Authentication
email.2fa.content=Your 2FA verification code is: \n{0}\nThe code will expire in 5 minutes

# Unblock due to inactivity
email.account.inactive.unblock.subject=Account blocked due to its inactivity
email.account.inactive.unblock.content=Hello {0},\n\nYour account has been blocked due to inactivity (over 30 days). Click the link below to unblock it:\n{1}

email.only.auth.subject=Code - Authentication with email address
email.only.auth.content=Your verification code is: \n{0}\nThe code will expire in 5 minutes.