# --- EMAIL MESSAGES (EmailService) ---
# Activation
email.activation.subject=Активація акаунта
email.activation.content=Перейдіть за посиланням, щоб активувати свій акаунт: {0}/activate?token={1}
email.activation.reminder.subject=Нагадування про активацію
email.activation.reminder.content=Минуло 12 годин. Будь ласка, активуйте свій акаунт: {0}/activate?token={1}
email.account.deleted.subject=Акаунт видалено
email.account.deleted.content=Ваш акаунт було видалено через відсутність активації протягом 24 годин.

# Account Status
email.account.blocked.subject=Сповіщення - Ваш акаунт заблоковано
email.account.blocked.content=Вітаємо, {0},\n\nВаш акаунт було заблоковано. Для отримання додаткової інформації зверніться до адміністратора.
email.account.unblocked.subject=Сповіщення - Ваш акаунт розблоковано
email.account.unblocked.content=Вітаємо, {0},\n\nВаш акаунт було розблоковано. Тепер ви можете знову увійти у свій акаунт.
email.autoblock.subject=Сповіщення - Ваш акаунт було автоматично заблоковано
email.autoblock.content=Вітаємо, {0},\n\nВаш акаунт було автоматично заблоковано на 24 години через 3 невдалі спроби входу поспіль.

# Email/Password Changes
email.email.changed.subject=Ваша електронна адреса була змінена адміністратором
email.email.changed.content=Вітаємо,\n\nПишемо, щоб повідомити вас, що адміністратор оновив вашу електронну адресу.\nЯкщо ви не робили запит на цю зміну, негайно зверніться до адміністратора.\n\nЗ повагою,
email.email.change.request.subject=Сповіщення - Ви надіслали запит на зміну електронної пошти
email.email.change.request.content=Вітаємо, {0},\n\nВи надіслали запит на зміну електронної пошти.\nБудь ласка, перейдіть за посиланням нижче, щоб підтвердити зміну:\n{1}\n\n
email.password.reset.subject=Скидання пароля
email.password.reset.content=Натисніть, щоб скинути пароль: {0}

# Access Levels & Roles
email.accesslevel.revoked.subject=Сповіщення - Рівень доступу відкликано
email.accesslevel.revoked.content=Вітаємо, {0},\n\nПишемо, щоб повідомити вас, що ваш рівень доступу було відкликано: {1}.
email.accesslevel.granted.subject=Сповіщення - Надано рівень доступу
email.accesslevel.granted.content=Вітаємо, {0},\n\nПишемо, щоб повідомити вас, що ви отримали новий рівень доступу: {1}.
email.admin.login.subject=Сповіщення - Виявлено новий вхід адміністратора
email.admin.login.content=Вітаємо, {0},\n\nУ вашому акаунті з правами Адміністратора виявлено нову сесію.\nIP-адреса: {1}

email.2fa.subject=Код - Двофакторна автентифікація (2FA)
email.2fa.content=Ваш код верифікації 2FA: \n{0}\nТермін дії коду закінчується через 5 хвилин

# Unblock due to inactivity
email.account.inactive.unblock.subject=Акаунт заблоковано через неактивність
email.account.inactive.unblock.content=Вітаємо, {0},\n\nВаш акаунт було заблоковано через неактивність (понад 30 днів). Перейдіть за посиланням нижче, щоб розблокувати його:\n{1}

email.only.auth.subject=Код - Автентифікація за допомогою електронної адреси
email.only.auth.content=Ваш код верифікації: \n{0}\nТермін дії коду закінчується через 5 хвилин.