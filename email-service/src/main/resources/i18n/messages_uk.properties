# --- EMAIL MESSAGES (EmailService) ---
# Activation
email.activation.subject=Активація облікового запису
email.activation.content=Натисніть на посилання нижче, щоб активувати свій обліковий запис:\n\n <a href="{0}/activate?token={1}">Підтвердити та активувати обліковий запис</a>
email.activation.reminder.subject=Нагадування про активацію
email.activation.reminder.content=Минуло 12 годин. Будь ласка, активуйте свій обліковий запис:\n\n <a href="{0}/activate?token={1}">Підтвердити та активувати обліковий запис</a>
email.account.deleted.subject=Обліковий запис видалено
email.account.deleted.content=Ваш обліковий запис було видалено через відсутність активації протягом 24 годин.

# Account Status
email.account.blocked.subject=Сповіщення - Ваш обліковий запис заблоковано
email.account.blocked.content=Вітаємо, {0}!\n\nВаш обліковий запис заблоковано. Для отримання додаткової інформації зверніться до адміністратора.
email.account.unblocked.subject=Сповіщення - Ваш обліковий запис розблоковано
email.account.unblocked.content=Вітаємо, {0}!\n\nВаш обліковий запис розблоковано. Тепер ви можете увійти у свій обліковий запис.
email.autoblock.subject=Сповіщення - Ваш обліковий запис автоматично заблоковано
email.autoblock.content=Вітаємо, {0}!\n\nВаш обліковий запис було автоматично заблоковано на 24 години через 3 невдалі спроби входу поспіль.

# Email/Password Changes
email.email.changed.subject=Вашу електронну адресу було змінено адміністратором
email.email.changed.content=Вітаємо!\n\nМи пишемо, щоб повідомити вам, що адміністратор оновив вашу електронну адресу.\nЯкщо ви не робили цього запиту, негайно зв'яжіться з адміністратором.\n\nЗ повагою,
email.email.change.request.subject=Сповіщення - Ви подали запит на зміну електронної адреси
email.email.change.request.content=Вітаємо, {0}!\n\nВи подали запит на зміну електронної адреси.\nНатисніть на посилання нижче, щоб підтвердити зміну:\n\n<a href="{1}">Підтвердити нову електронну адресу</a>\n\n
email.password.reset.subject=Скидання пароля
email.password.reset.content=Натисніть на посилання нижче, щоб скинути пароль:\n\n <a href="{0}">Скинути пароль</a>

# Access Levels & Roles
email.accesslevel.revoked.subject=Сповіщення - Рівень доступу скасовано
email.accesslevel.revoked.content=Вітаємо, {0}!\n\nМи пишемо, щоб повідомити вам, що ваш рівень доступу було скасовано: {1}.
email.accesslevel.granted.subject=Сповіщення - Рівень доступу надано
email.accesslevel.granted.content=Вітаємо, {0}!\n\nМи пишемо, щоб повідомити вам, що вам надано новий рівень доступу: {1}.
email.admin.login.subject=Сповіщення - Виявлено новий вхід адміністратора
email.admin.login.content=Вітаємо, {0}!\n\nВиявлено новий сеанс на вашому обліковому записі з правами Адміністратора.\nIP-адреса: {1}

email.2fa.subject=Код - Двофакторна автентифікація (2FA)
email.2fa.content=Ваш код перевірки 2FA: \n<b>{0}</b>\nКод дійсний протягом 5 хвилин.

# Unblock due to inactivity
email.account.inactive.unblock.subject=Обліковий запис заблоковано через неактивність
email.account.inactive.unblock.content=Вітаємо, {0}!\n\nВаш обліковий запис було заблоковано через неактивність (понад 30 днів). Натисніть на посилання нижче, щоб його розблокувати:\n\n<a href="{1}">Розблокувати обліковий запис</a>

email.only.auth.subject=Код - Авторизація за електронною адресою
email.only.auth.content=Ваш код перевірки: \n<b>{0}</b>\nКод дійсний протягом 5 хвилин.

email.email.revert.subject=Скасування зміни електронної адреси
email.email.revert.content=Вітаємо, {0}!\n\nВашу електронну адресу було змінено на {1}. Якщо це зробили не ви, натисніть нижче:\n\n<a href="{2}">Скасувати зміну електронної адреси</a>

error.email.microservice.failure=Сталася помилка під час зв'язку з поштовим сервером. Будь ласка, спробуйте пізніше.