# --- EMAIL MESSAGES (EmailService) ---
# Activation
email.activation.subject=Aktywacja Konta
email.activation.content=Kliknij w poniższy link, aby aktywować swoje konto:\n\n <a href="{0}/activate?token={1}">Potwierdź i aktywuj konto</a>
email.activation.reminder.subject=Przypomnienie o Aktywacji
email.activation.reminder.content=Minęło 12 godzin. Prosimy o aktywację konta:\n\n <a href="{0}/activate?token={1}">Potwierdź i aktywuj konto</a>
email.account.deleted.subject=Konto Usunięte
email.account.deleted.content=Twoje konto zostało usunięte z powodu braku aktywacji w ciągu 24 godzin.

# Account Status
email.account.blocked.subject=Powiadomienie - Twoje konto zostało zablokowane
email.account.blocked.content=Witaj {0},\n\nTwoje konto zostało zablokowane. Aby uzyskać więcej informacji, skontaktuj się z administratorem.
email.account.unblocked.subject=Powiadomienie - Twoje konto zostało odblokowane
email.account.unblocked.content=Witaj {0},\n\nTwoje konto zostało odblokowane. Możesz ponownie zalogować się na swoje konto.
email.autoblock.subject=Powiadomienie - Twoje konto zostało automatycznie zablokowane
email.autoblock.content=Witaj {0},\n\nTwoje konto zostało automatycznie zablokowane na 24 godziny z powodu 3 nieudanych prób logowania z rzędu.

# Email/Password Changes
email.email.changed.subject=Twój adres email został zmieniony przez administratora
email.email.changed.content=Witaj,\n\nPiszemy, aby poinformować Cię, że administrator zaktualizował Twój adres email.\nJeśli nie prosiłeś o tę zmianę, natychmiast skontaktuj się z administratorem.\n\nPozdrawiamy,
email.email.change.request.subject=Powiadomienie - Poprosiłeś o zmianę adresu email
email.email.change.request.content=Witaj {0},\n\nPoprosiłeś o zmianę adresu email.\nKliknij w poniższy link, aby potwierdzić zmianę:\n\n<a href="{1}">Potwierdź nowy adres email</a>\n\n
email.password.reset.subject=Reset Hasła
email.password.reset.content=Kliknij w poniższy link, aby zresetować hasło:\n\n <a href="{0}">Zresetuj hasło</a>

# Access Levels & Roles
email.accesslevel.revoked.subject=Powiadomienie - Odebrano Poziom Dostępu
email.accesslevel.revoked.content=Witaj {0},\n\nPiszemy, aby poinformować Cię, że Twój poziom dostępu został odebrany: {1}.
email.accesslevel.granted.subject=Powiadomienie - Przyznano Poziom Dostępu
email.accesslevel.granted.content=Witaj {0},\n\nPiszemy, aby poinformować Cię, że otrzymałeś nowy poziom dostępu: {1}.
email.admin.login.subject=Powiadomienie - Wykryto nowe logowanie administratora
email.admin.login.content=Witaj {0},\n\nWykryto nową sesję na Twoim koncie z uprawnieniami Administratora.\nAdres IP: {1}

email.2fa.subject=Kod - Uwierzytelnianie dwuetapowe (2FA)
email.2fa.content=Twój kod weryfikacyjny 2FA to: \n<b>{0}</b>\nKod wygaśnie za 5 minut.

# Unblock due to inactivity
email.account.inactive.unblock.subject=Konto zablokowane z powodu nieaktywności
email.account.inactive.unblock.content=Witaj {0},\n\nTwoje konto zostało zablokowane z powodu nieaktywności (ponad 30 dni). Kliknij w poniższy link, aby je odblokować:\n\n<a href="{1}">Odblokuj swoje konto</a>

email.only.auth.subject=Kod - Uwierzytelnianie adresem email
email.only.auth.content=Twój kod weryfikacyjny to: \n<b>{0}</b>\nKod wygaśnie za 5 minut.

email.email.revert.subject=Cofnięcie zmiany adresu email
email.email.revert.content=Witaj {0},\n\nTwój adres email został zmieniony na {1}. Jeśli to nie Ty, kliknij poniżej:\n\n<a href="{2}">Cofnij zmianę email</a>

error.email.microservice.failure=Wystąpił błąd podczas komunikacji z serwerem pocztowym. Spróbuj ponownie później.