stages:
  - test
  - build
  - deploy

test-backend:
  stage: test
  image: maven:3.9.14-eclipse-temurin-25-alpine
  script:
    - mvn test

build-backend:
  stage: build
  image: docker:29.4.0
  services:
    - docker:29.4.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t registry.gitlab.com/iitpl/ssbd/2026/01/api:latest .
    - docker push registry.gitlab.com/iitpl/ssbd/2026/01/api:latest
  only:
    - main

deploy-backend:
  stage: deploy
  tags:
    - ovirt-runner
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - cd /opt/api
    - git pull origin main
    - docker compose -f docker-compose.prod.yml pull backend
    - docker compose -f docker-compose.prod.yml up -d backend
  only:
    - main
