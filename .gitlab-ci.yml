stages:
  - test
  - analyze
  - build
  - deploy

test-backend:
  stage: test
  image: maven:3.9.14-eclipse-temurin-25-alpine
  services:
    - docker:29.4.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - mkdir -p secrets api/secrets
    - echo "$CI_PG_PASSWORD" > secrets/pg_password.txt
    - echo "$CI_MOK_PASSWORD" > secrets/mok_password.txt
    - echo "$CI_MPP_PASSWORD" > secrets/mpp_password.txt
    - echo "test_mail_password" > secrets/mail_password.txt
    - echo "dummy_test_token" > secrets/gitea_token.txt
    - cp -r secrets/* api/secrets/

    - export PG_DATABASE=$CI_PG_DATABASE
    - export PG_USERNAME=$CI_PG_USERNAME
    - export ADMIN_USER=$CI_PG_USERNAME
    - export MOK_USER=$CI_MOK_USER
    - export MPP_USER=$CI_MPP_USER

    - export GITEA_URL=http://localhost:3000
    - export MAIL_HOST=localhost
    - export MAIL_PORT=1025
    - export MAIL_USERNAME=test
    - export MAIL_PASSWORD=test

    - mvn test -e -DtrimStackTrace=false
  artifacts:
    when: always
    paths:
      - api/target/surefire-reports/
      - target/surefire-reports/
    expire_in: 1 week

sonarqube-check:
  stage: analyze
  image: maven:3.9.14-eclipse-temurin-25-alpine
  tags:
    - ovirt-runner
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - mvn test-compile sonar:sonar -Dsonar.projectKey=Uczelniany-system-antyplagiatowy
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  allow_failure: true


build-backend:
  stage: build
  image: docker:29.4.0
  services:
    - docker:29.4.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --build-arg MODULE_NAME=api -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest

    - docker build --build-arg MODULE_NAME=email-service -t $CI_REGISTRY_IMAGE/email-service:latest .
    - docker push $CI_REGISTRY_IMAGE/email-service:latest

    - docker build --build-arg MODULE_NAME=eureka-server -t $CI_REGISTRY_IMAGE/eureka-server:latest .
    - docker push $CI_REGISTRY_IMAGE/eureka-server:latest

    - docker build --build-arg MODULE_NAME=config-server -t $CI_REGISTRY_IMAGE/config-server:latest .
    - docker push $CI_REGISTRY_IMAGE/config-server:latest

    - docker build --build-arg MODULE_NAME=mcp-server -t $CI_REGISTRY_IMAGE/mcp-server:latest .
    - docker push $CI_REGISTRY_IMAGE/mcp-server:latest
  only:
    - main

deploy-backend:
  stage: deploy
  tags:
    - ovirt-runner
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - cd /opt/api
    - git pull origin main
    - mkdir -p secrets
    - echo "$CI_PG_PASSWORD" > secrets/pg_password.txt
    - echo "$CI_MOK_PASSWORD" > secrets/mok_password.txt
    - echo "$CI_MPP_PASSWORD" > secrets/mpp_password.txt
    - echo "$CI_GITEA_DB_PASSWORD" > secrets/gitea_db_password.txt
    - export PG_USERNAME=$CI_PG_USERNAME
    - export PG_DATABASE=$CI_PG_DATABASE
    - export MOK_USER=$CI_MOK_USER
    - export MPP_USER=$CI_MPP_USER
    - export APP_FRONTEND_URL=$CI_APP_FRONTEND_URL
    - export GOOGLE_CLIENT_ID=$CI_GOOGLE_CLIENT_ID
    - export GITEA_URL=$CI_GITEA_URL
    - export VAULT_TOKEN=$CI_VAULT_TOKEN
    - docker compose -f docker-compose.prod.yml build pgpool
    - docker compose -f docker-compose.prod.yml pull backend email-service eureka-server config-server mcp-server
    - docker compose -f docker-compose.prod.yml up -d
  only:
    - main