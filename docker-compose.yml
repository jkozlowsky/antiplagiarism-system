services:
  proxy:
    image: nginx:1.29.6
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - proxy-frontend
      - proxy-backend
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../web
    networks:
      - proxy-frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://localhost:80/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
    environment:
      - APP_FRONTEND_URL=https://localhost
      - TZ=Europe/Warsaw
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${PG_DATABASE}
      - ADMIN_USER=${PG_USERNAME}
      - MOK_USER=${MOK_USER}
      - MPP_USER=${MPP_USER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SERVER_PORT=8082
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,loggers
    secrets:
      - pg_password
      - mok_password
      - mpp_password
      - mail_password
      - jwt_secret
      - mail_password
      - frontend_url
    volumes:
      - ../logs:/app/logs
    networks:
      - proxy-backend
      - backend-db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://localhost:8082/actuator/health | grep -q 'UP' || exit 1" ]
      interval: 20s
      start_period: 40s

  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      MOK_USER: ${MOK_USER}
      MPP_USER: ${MPP_USER}

    secrets:
      - pg_password
      - mok_password
      - mpp_password
      - jwt_secret
    ports:
      - 5434:5432
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - db_data:/var/lib/postgresql
    networks:
      - backend-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${PG_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  proxy-frontend:
    driver: bridge
  proxy-backend:
    driver: bridge
  backend-db:
    driver: bridge

volumes:
  db_data:

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
  mok_password:
    file: ./secrets/mok_password.txt
  mpp_password:
    file: ./secrets/mpp_password.txt
  mail_password:
    file: ./secrets/mail_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  frontend_url:
    file: ./secrets/frontend_url.txt
  version_hash_secret:
    file: ./secrets/version_hash_secret.txt