services:
  proxy:
    image: nginx:1.29.6
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - proxy-frontend
      - proxy-backend
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      gitea:
        condition: service_started

  frontend:
    build:
      context: ../web
    networks:
      - proxy-frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://localhost:80/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
    environment:
      - APP_FRONTEND_URL=https://localhost
      - TZ=Europe/Warsaw
      - DB_HOST=pgpool
      - DB_PORT=5432
      - DB_NAME=${PG_DATABASE}
      - ADMIN_USER=${PG_USERNAME}
      - MOK_USER=${MOK_USER}
      - MPP_USER=${MPP_USER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SERVER_PORT=8082
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,loggers
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GITEA_URL=${GITEA_URL}
      - GITEA_TOKEN=${GITEA_TOKEN}
    secrets:
      - pg_password
      - mok_password
      - mpp_password
      - mail_password
      - jwt_secret
      - frontend_url
    volumes:
      - ../logs:/app/logs
    networks:
      - proxy-backend
      - backend-db
    depends_on:
      pgpool:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://localhost:8082/actuator/health | grep -q 'UP' || exit 1" ]
      interval: 20s
      start_period: 40s

  pgpool:
    build: ./pgpool
    ports:
      - "5434:5432"
    networks:
      - backend-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5432 -U repuser -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica-1:
        condition: service_healthy
      db-replica-2:
        condition: service_healthy

  db-primary:
    image: postgres:18.3
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_HOST_AUTH_METHOD: trust
      MOK_USER: ${MOK_USER}
      MPP_USER: ${MPP_USER}
    secrets:
      - pg_password
      - mok_password
      - mpp_password
      - jwt_secret
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - db_primary_data:/var/lib/postgresql/data
    networks:
      - backend-db
    command: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${PG_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica-1:
    image: postgres:18.3
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_HOST_AUTH_METHOD: trust
    secrets:
      - pg_password
    volumes:
      - db_replica_1_data:/var/lib/postgresql/data
    networks:
      - backend-db
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
        until pg_isready -h db-primary -p 5432 -U ${PG_USERNAME} -d ${PG_DATABASE}; do sleep 2; done
        rm -rf /var/lib/postgresql/data/pgdata/*
        pg_basebackup -h db-primary -p 5432 -D /var/lib/postgresql/data/pgdata -U repuser -vP
        touch /var/lib/postgresql/data/pgdata/standby.signal
        echo \"primary_conninfo = 'host=db-primary port=5432 user=repuser application_name=db-replica-1'\" >> /var/lib/postgresql/data/pgdata/postgresql.auto.conf
      fi
      exec docker-entrypoint.sh postgres
      "
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${PG_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica-2:
    image: postgres:18.3
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_HOST_AUTH_METHOD: trust
    secrets:
      - pg_password
    volumes:
      - db_replica_2_data:/var/lib/postgresql/data
    networks:
      - backend-db
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
        until pg_isready -h db-primary -p 5432 -U ${PG_USERNAME} -d ${PG_DATABASE}; do sleep 2; done
        rm -rf /var/lib/postgresql/data/pgdata/*
        pg_basebackup -h db-primary -p 5432 -D /var/lib/postgresql/data/pgdata -U repuser -vP
        touch /var/lib/postgresql/data/pgdata/standby.signal
        echo \"primary_conninfo = 'host=db-primary port=5432 user=repuser application_name=db-replica-2'\" >> /var/lib/postgresql/data/pgdata/postgresql.auto.conf
      fi
      exec docker-entrypoint.sh postgres
      "
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${PG_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    image: docker.gitea.com/gitea:1.25.2-rootless
    hostname: gitea
    restart: always
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD:-gitea}
      - GITEA__server__ROOT_URL=http://localhost:3000/
    volumes:
      - "../gitea-local/data:/var/lib/gitea"
      - "../gitea-local/config:/etc/gitea"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:2222"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy-backend
      - gitea-net
    depends_on:
      gitea-db:
        condition: service_healthy

  gitea-db:
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD:-gitea}
      - POSTGRES_DB=gitea
    volumes:
      - gitea_db_data_local:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "gitea" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gitea-net

networks:
  proxy-frontend:
    driver: bridge
  proxy-backend:
    driver: bridge
  backend-db:
    driver: bridge
  gitea-net:
    driver: bridge

volumes:
  db_primary_data:
  db_replica_1_data:
  db_replica_2_data:
  gitea_db_data_local:

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
  mok_password:
    file: ./secrets/mok_password.txt
  mpp_password:
    file: ./secrets/mpp_password.txt
  mail_password:
    file: ./secrets/mail_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  frontend_url:
    file: ./secrets/frontend_url.txt
  version_hash_secret:
    file: ./secrets/version_hash_secret.txt