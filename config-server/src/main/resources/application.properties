spring.application.name=config-server
server.port=8888
spring.main.allow-bean-definition-overriding=true
spring.profiles.active=native,vault
spring.cloud.config.server.native.search-locations=file:/app/config-repo
spring.cloud.config.server.vault.host=vault
spring.cloud.config.server.vault.port=8200
spring.cloud.config.server.vault.scheme=http
spring.cloud.config.server.vault.authentication=TOKEN
spring.cloud.config.server.vault.token=my-super-secret-token
spring.cloud.config.server.vault.kv-version=2
spring.cloud.config.server.vault.backend=secret
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
spring.cloud.vault.host=vault
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=my-super-secret-token
